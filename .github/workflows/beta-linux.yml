name: Beta Linux

# Fork: Linux binaries for the rolling beta. A beta built on our own Mac
# (`just beta-local`) carries only the macOS binary; this adds static
# herdr-linux-x86_64 and herdr-linux-aarch64 of the same commit and version
# string to the `beta` release, with .sha256 files, so a Linux herdr machine
# can run the beta (install by hand, or upload with HERDR_REMOTE_BINARY).
# `just beta-linux` dispatches it for the published beta.
# https://gitea.cat-bluegill.ts.net/AC-forks/herdr-max/issues/239

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit the published beta was built from"
        required: true
        type: string
      build_id:
        description: "The published beta's build id, e.g. 169-chiesa"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must match rust-toolchain.toml so the cross target's std is installed for the
  # pinned toolchain (otherwise the build fails with "can't find crate for core").
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            name: herdr-linux-aarch64
    runs-on: ubuntu-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
      HERDR_BUILD_CHANNEL: ac-beta
      HERDR_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - name: Check the build id
        run: |
          if ! [[ "$HERDR_BUILD_ID" =~ ^[0-9]+-[a-z]+$ ]]; then
            echo "build id '$HERDR_BUILD_ID' is not <number>-<codename>" >&2
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: beta-linux-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the version
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BASE=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          got=$(target/${{ matrix.target }}/release/herdr --version)
          if [ "$got" != "herdr ${BASE}-ac-beta.${HERDR_BUILD_ID}" ]; then
            echo "the binary says '$got', expected 'herdr ${BASE}-ac-beta.${HERDR_BUILD_ID}'" >&2
            exit 1
          fi

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    needs: build
    name: Add to the beta release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Upload to the beta release
        # Only onto the beta these binaries belong to: a newer beta published
        # meanwhile keeps its own assets.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          REPO: ${{ github.repository }}
        run: |
          BASE=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          WANT="Beta ${BASE}-ac-beta.${BUILD_ID}"
          title=$(gh release view beta --repo "$REPO" --json name --jq .name)
          if [ "$title" != "$WANT" ]; then
            echo "the beta release is '$title', not '$WANT': nothing uploaded" >&2
            exit 1
          fi
          files=()
          for name in herdr-linux-x86_64 herdr-linux-aarch64; do
            (cd "$name" && sha256sum "$name" > "$name.sha256")
            files+=("$name/$name" "$name/$name.sha256")
          done
          gh release upload beta --repo "$REPO" --clobber "${files[@]}"
          cat herdr-linux-*/*.sha256
